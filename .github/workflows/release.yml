name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NOTARYTOOL_PROFILE: TextAnywhere-CI

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          SEMVER='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG" =~ $SEMVER ]]; then
            echo "::error::Tag '$TAG' is not a semantic version (expected vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD])."
            exit 1
          fi
          # CFBundleShortVersionString only accepts period-separated integers.
          MARKETING_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          PRERELEASE="${BASH_REMATCH[5]}"
          # The commit count keeps CFBundleVersion increasing across releases.
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "marketing_version=$MARKETING_VERSION"
            echo "build_number=$BUILD_NUMBER"
            echo "is_prerelease=$([[ -n "$PRERELEASE" ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 27\.' || { echo "::error::Xcode 27 is required."; exit 1; }

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"

          echo -n "$DEVELOPER_ID_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Store notarization credentials
        env:
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${NOTARY_API_KEY_ID}.p8"
          echo -n "$NOTARY_API_KEY_P8_BASE64" | base64 --decode -o "$API_KEY_PATH"
          xcrun notarytool store-credentials "$NOTARYTOOL_PROFILE" \
            --key "$API_KEY_PATH" \
            --key-id "$NOTARY_API_KEY_ID" \
            --issuer "$NOTARY_API_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm -f "$API_KEY_PATH"

      - name: Archive, notarize, and package
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.build_number }}
          OUTPUT_PATH: .build/release/TextAnywhere-${{ steps.version.outputs.version }}.zip
        run: ./script/package_and_notarize.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
        run: |
          RELEASE_FLAGS=(--verify-tag --title "TextAnywhere ${TAG#v}" --generate-notes)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "${RELEASE_FLAGS[@]}" .build/release/*

      - name: Remove signing keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
